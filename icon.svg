<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- the daimonji: the send-off fire burned into the mountainside.
       source of record only — the PNG icons are richer renders of this same mark
       (Songti strokes, ember fill, white-hot heart). -->
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>
  <rect width="64" height="64" rx="9" fill="#0e0b09"/>
  <text x="32" y="33" font-family="Songti SC, Hiragino Mincho ProN, serif" font-size="44"
        fill="#ff5a14" opacity=".8" text-anchor="middle" dominant-baseline="central" filter="url(#glow)">大</text>
  <text x="32" y="33" font-family="Songti SC, Hiragino Mincho ProN, serif" font-size="44"
        fill="#ff8a2a" text-anchor="middle" dominant-baseline="central">大</text>
</svg>
